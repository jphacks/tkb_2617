<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>家具組み立てガイド</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; height: 100vh; display: grid;
           grid-template-columns: 280px 1fr 380px; }
    #panel { padding: 16px; border-right: 1px solid #ddd; overflow-y: auto; }
    #view { position: relative; min-width: 0; overflow: hidden; }
    #view canvas { position: absolute; top: 0; left: 0; display: block; }
    #pdf { width: 100%; height: 100%; border: 0; border-left: 1px solid #ddd; }
    button { padding: 10px 14px; margin: 4px 4px 4px 0; font-size: 15px; cursor: pointer; }
    #stepText { font-size: 18px; line-height: 1.6; margin: 16px 0; min-height: 90px; }
    #status { color: #666; font-size: 13px; }
    .row { margin: 8px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div id="panel">
    <h2>組み立てガイド</h2>
    <input type="file" id="file" accept="application/pdf" />
    <div><button id="analyze">説明書を解析</button></div>
    <div><button id="sample">サンプル表示（テスト用）</button></div>
    <div id="status"></div>
    <hr />
    <div id="stepNo"></div>
    <div id="stepText">PDFを選んで「説明書を解析」を押してください。</div>
    <button id="prev">◀ 戻る</button>
    <button id="next">次へ ▶</button>
    <button id="repeat">もう一回</button>
    <hr />
    <div>
      <button id="play">▶ 自動再生</button>
      <button id="stop">■ 停止</button>
    </div>
    <div class="row">
      速さ:
      <select id="speed">
        <option value="0.6">ゆっくり</option>
        <option value="1" selected>ふつう</option>
        <option value="1.6">はやい</option>
      </select>
      <label><input type="checkbox" id="voice" checked /> 音声案内</label>
    </div>
    <div style="margin-top:12px">
      <button id="mic">音声操作 OFF</button>
      <div style="font-size:12px;color:#666">「次」「戻る」「もう一回」「再生」「停止」と話しかけてください</div>
    </div>
  </div>
  <div id="view"></div>
  <iframe id="pdf"></iframe>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
